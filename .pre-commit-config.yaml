repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format check
        entry: bash -c 'cd backend && uv run ruff format --check .'
        language: system
        pass_filenames: false
