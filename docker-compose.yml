services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energydiag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energydiag}
      POSTGRES_DB: ${POSTGRES_DB:-energydiag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energydiag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.1
    command: ["server", "--console-enable", "--console-address", ":9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUSTFS_OBS_ENVIRONMENT: development
    volumes:
      - rustfsdata:/data
      - rustfslogs:/logs
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://energydiag:energydiag@host.docker.internal:5432/energydiag}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://host.docker.internal:9000}
      S3_BUCKET: ${S3_BUCKET:-energydiag}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      UV_PROJECT_ENVIRONMENT: /opt/venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: node:lts
    working_dir: /app
    volumes:
      - ./frontend:/app
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  rustfsdata:
  rustfslogs:
  uploads:
